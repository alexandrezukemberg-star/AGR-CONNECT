<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGR CONNECT — Mensagens sem telefone</title>
<link rel="icon" type="image/jpeg" href="./agr-logo.jpg">
<style>
:root{font-family:Arial,system-ui,sans-serif;color:#e8f1fa;background:#09111e}
*{box-sizing:border-box}body{margin:0}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#278ed1;color:#fff;font-weight:700}
button.secondary{background:#26384a}button:disabled{opacity:.5}
input{width:100%;border:1px solid #34485b;border-radius:12px;background:#111f30;color:#fff;padding:13px;outline:none}
input:focus{border-color:#278ed1}.shell{max-width:1200px;margin:auto;min-height:100vh}
.auth{max-width:430px;margin:7vh auto;padding:30px;border:1px solid #294052;border-radius:24px;background:#101d2c}
.logo{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:900}.logo em{font-style:normal;color:#5cbcff}
.brand-mark{display:grid;place-items:center;width:82px;height:82px;flex-shrink:0;border-radius:17px;background:white;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.muted{color:#a2b4c4;font-size:14px}.stack{display:grid;gap:12px;margin-top:20px}
.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#2a3342;color:#d7e6ef;font-size:13px}
.app{display:none;height:100vh;min-height:500px}.sidebar{width:340px;flex-shrink:0;background:#0f1c2c;border-right:1px solid #26394b;padding:18px;display:flex;flex-direction:column;gap:14px}
.sidebar .brand-mark{width:52px;height:52px}.sidebar .logo{font-size:21px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}.top{padding:18px;border-bottom:1px solid #26394b}
.convos{overflow:auto;flex:1}.contact{padding:13px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.contact:hover{background:#20344a}.avatar{width:40px;height:40px;border-radius:50%;background:#214e5a;display:grid;place-items:center}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:12px 15px;border-radius:15px;background:#22384b;align-self:flex-start;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:#155a9a}.bubble small{display:block;opacity:.7;margin-top:5px;font-size:11px}
.composer{display:flex;gap:8px;padding:15px;border-top:1px solid #26394b}.composer input{flex:1;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{margin:auto;text-align:center;color:#9cb0c2;padding:20px}
@media(max-width:700px){.sidebar{width:100%;height:100%;border:0}.app.show-chat .sidebar{display:none}.app:not(.show-chat) .chat{display:none}.chat{width:100%}.auth{margin:5vh 14px}.top{padding:12px}}
</style>
<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="shell">
<section class="auth" id="auth">
<div class="logo"><span class="brand-mark"><img src="./agr-logo.jpg" alt="Logotipo AGR"></span><span>AGR <em>CONNECT</em></span></div>
<h1 id="authTitle">Entrar</h1>
<p class="muted">Mensagens sem número de telefone. Sua conta começa com seu e-mail.</p>
<form class="stack" id="authForm">
<input id="email" type="email" autocomplete="email" placeholder="Seu e-mail" required>
<input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="Senha (mínimo 8 caracteres)" required>
<div id="signupFields" class="stack hidden">
<input id="displayName" placeholder="Seu nome" maxlength="70">
<input id="username" placeholder="Nome de usuário (ex.: alexandre_agr)" maxlength="25" pattern="[a-zA-Z0-9_]{3,25}">
</div>
<button type="submit" id="authSubmit">Entrar</button>
<button type="button" class="secondary" id="toggleAuth">Criar uma conta</button>
</form>
<p class="notice" id="authNotice">Conectando ao serviço...</p>
</section>
<section class="app" id="app">
<aside class="sidebar">
<div class="logo"><span class="brand-mark"><img src="./agr-logo.jpg" alt="Logotipo AGR"></span><span>AGR <em>CONNECT</em></span></div>
<div class="actions"><button class="secondary" id="profileBtn">Meu perfil</button><button class="secondary" id="logoutBtn">Sair</button></div>
<div class="muted" id="me"></div>
<input id="search" placeholder="Buscar @usuário">
<button id="searchBtn">Encontrar pessoas</button>
<div class="notice" id="sideNotice">Selecione uma conversa ou procure um usuário.</div>
<h3>Conversas</h3><div class="convos" id="convos"></div>
</aside>
<main class="chat">
<div class="top"><button class="secondary" id="backBtn" style="display:none">←</button> <strong id="chatTitle">Selecione uma conversa</strong></div>
<div class="messages" id="messages"><div class="empty">Escolha uma conversa para começar.</div></div>
<form class="composer" id="messageForm">
<input id="messageInput" maxlength="4000" placeholder="Escreva uma mensagem..." disabled>
<button id="sendBtn" disabled>Enviar</button>
</form>
</main></section></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const say = (id, text) => { $(id).textContent = text; };
const err = error => error?.message || 'Não foi possível concluir a operação.';
const config = window.AGR_CONNECT_CONFIG || {};
let client = null, me = null, peer = null, channel = null, signingUp = false;
try {
  if (config.url && config.publishableKey && window.supabase?.createClient) {
    client = window.supabase.createClient(config.url, config.publishableKey);
    say('authNotice', 'Conexão preparada. Entre ou crie sua conta.');
  } else {
    say('authNotice', 'Não foi possível carregar a conexão. Verifique config.js e a biblioteca Supabase.');
  }
} catch (error) { say('authNotice', 'Erro ao iniciar conexão: ' + err(error)); }

function toggle() {
  signingUp = !signingUp;
  $('signupFields').classList.toggle('hidden', !signingUp);
  say('authTitle', signingUp ? 'Criar conta' : 'Entrar');
  say('authSubmit', signingUp ? 'Cadastrar' : 'Entrar');
  say('toggleAuth', signingUp ? 'Já tenho uma conta' : 'Criar uma conta');
  $('displayName').required = signingUp;
  $('username').required = signingUp;
  $('password').autocomplete = signingUp ? 'new-password' : 'current-password';
}
$('toggleAuth').onclick = toggle;
$('authForm').onsubmit = async event => {
  event.preventDefault();
  if (!client) return say('authNotice', 'A conexão com o Supabase ainda não está disponível.');
  const email = $('email').value.trim(), password = $('password').value;
  try {
    if (signingUp) {
      const username = $('username').value.trim().toLowerCase();
      const {error} = await client.auth.signUp({
        email, password, options:{data:{username, display_name:$('displayName').value.trim()}}
      });
      if (error) throw error;
      say('authNotice', 'Confira seu e-mail e confirme o cadastro. Depois entre com sua senha.');
    } else {
      const {error} = await client.auth.signInWithPassword({email, password});
      if (error) throw error;
    }
  } catch (error) { say('authNotice', err(error)); }
};
async function boot() {
  if (!client) return;
  try {
    const {data:{session}, error} = await client.auth.getSession();
    if (error) throw error;
    await sessionChanged(session);
    client.auth.onAuthStateChange((_event, session) => {
      setTimeout(() => sessionChanged(session), 0);
    });
  } catch(error) { say('authNotice', err(error)); }
}
async function sessionChanged(session) {
  if (!session) {
    me = null; peer = null;
    if (channel) { await client.removeChannel(channel); channel = null; }
    $('auth').style.display = 'block';
    $('app').style.display = 'none';
    return;
  }
  me = session.user;
  $('auth').style.display = 'none';
  $('app').style.display = 'flex';
  try {
    const {data, error} = await client.from('profiles').select('username,display_name').eq('id',me.id).single();
    if (error) throw error;
    say('me', `${data.display_name} · @${data.username}`);
    await loadConversations();
  } catch(error) { say('sideNotice', 'Não foi possível carregar o perfil: ' + err(error)); }
}
$('logoutBtn').onclick = () => client?.auth.signOut();
$('profileBtn').onclick = async () => {
  if (!client || !me) return;
  const name = prompt('Nome de exibição:');
  if (name === null) return;
  const clean = name.trim();
  if (!clean || clean.length > 70) return say('sideNotice', 'Nome inválido.');
  const {error} = await client.from('profiles').update({display_name:clean}).eq('id',me.id);
  say('sideNotice', error ? err(error) : 'Perfil atualizado.');
  if (!error) say('me',clean);
};
$('searchBtn').onclick = async () => {
  if (!client || !me) return;
  const name = $('search').value.trim().replace(/^@/,'').toLowerCase();
  if (!/^[a-z0-9_]{3,25}$/.test(name)) return say('sideNotice','Digite um @usuário válido.');
  const {data,error} = await client.from('profiles').select('id,username,display_name').eq('username',name).maybeSingle();
  if (error) return say('sideNotice',err(error));
  if (!data) return say('sideNotice','Usuário não encontrado.');
  if (data.id === me.id) return say('sideNotice','Este é seu próprio perfil.');
  say('sideNotice', `Encontrado: ${data.display_name} (@${data.username})`);
  await selectPeer(data);
};
function contactNode(profile) {
  const element = document.createElement('div');
  element.className = 'contact';
  const avatar = document.createElement('span');
  avatar.className = 'avatar';
  avatar.textContent = (profile.display_name || '?').slice(0,1).toUpperCase();
  const label = document.createElement('span');
  label.textContent = `${profile.display_name} · @${profile.username}`;
  element.append(avatar,label);
  element.onclick = () => selectPeer(profile);
  return element;
}
async function loadConversations() {
  const {data,error} = await client.from('direct_messages')
    .select('sender_id,recipient_id')
    .or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`)
    .order('created_at',{ascending:false}).limit(200);
  if (error) return say('sideNotice',err(error));
  const ids = [...new Set((data||[]).map(m => m.sender_id===me.id ? m.recipient_id : m.sender_id))];
  $('convos').replaceChildren();
  if (!ids.length) return say('convos','Ainda não há conversas.');
  const {data:profiles,error:profileError} = await client.from('profiles')
    .select('id,username,display_name').in('id',ids);
  if (profileError) return say('sideNotice',err(profileError));
  for (const profile of profiles || []) $('convos').append(contactNode(profile));
}
async function selectPeer(profile) {
  peer = profile;
  say('chatTitle',`${profile.display_name} · @${profile.username}`);
  $('messageInput').disabled = false;
  $('sendBtn').disabled = false;
  $('app').classList.add('show-chat');
  $('backBtn').style.display = 'inline-block';
  if (channel) { await client.removeChannel(channel); channel = null; }
  await loadMessages();
  channel = client.channel(`dm-${me.id}-${profile.id}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages'}, payload => {
      const m = payload.new;
      if ((m.sender_id===me.id && m.recipient_id===peer?.id) ||
          (m.sender_id===peer?.id && m.recipient_id===me.id)) loadMessages();
    }).subscribe();
}
$('backBtn').onclick = () => $('app').classList.remove('show-chat');
async function loadMessages() {
  if (!peer) return;
  const selected = peer.id;
  const {data,error} = await client.from('direct_messages')
    .select('id,sender_id,recipient_id,body,created_at')
    .or(`and(sender_id.eq.${me.id},recipient_id.eq.${selected}),and(sender_id.eq.${selected},recipient_id.eq.${me.id})`)
    .order('created_at',{ascending:true}).limit(200);
  if (selected !== peer?.id) return;
  if (error) return say('sideNotice',err(error));
  $('messages').replaceChildren();
  if (!data?.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Diga olá! Esta conversa ainda não tem mensagens.';
    $('messages').append(empty);
  }
  for (const message of data || []) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (message.sender_id===me.id ? ' mine' : '');
    const text = document.createElement('div');
    text.textContent = message.body;
    const time = document.createElement('small');
    time.textContent = new Date(message.created_at).toLocaleString();
    bubble.append(text,time);
    $('messages').append(bubble);
  }
  $('messages').scrollTop = $('messages').scrollHeight;
}
$('messageForm').onsubmit = async event => {
  event.preventDefault();
  if (!client || !peer) return;
  const body = $('messageInput').value.trim();
  if (!body) return;
  $('sendBtn').disabled = true;
  const {error} = await client.from('direct_messages').insert({
    sender_id:me.id, recipient_id:peer.id, body
  });
  $('sendBtn').disabled = false;
  if (error) return say('sideNotice',err(error));
  $('messageInput').value = '';
  await loadMessages();
  await loadConversations();
};
boot();
</script>
</body>
</html>
